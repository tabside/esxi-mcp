[project]
name = "esxi-mcp"
# Nur Major.Minor wird von Hand gepflegt, der Patch-Teil wird automatisch
# aus der Git-Historie gezaehlt (siehe _read_version im Paket).
version = "0.1.0"
description = "MCP-Server fuer einen VMware-ESXi-Host: Host, Datastores, VMs, Snapshots, Tasks, Events lesen sowie Power-Aktionen, Snapshots und RAM/CPU-Aenderungen mit confirm"
requires-python = ">=3.12"
dependencies = [
    "uvicorn>=0.30.0",
    "starlette>=0.27.0",
    "mcp>=1.9,<2",
    "pyvmomi>=8.0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esxi_mcp"]
